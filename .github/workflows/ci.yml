name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENV: production
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Secret detection (blocking)
        # Flags come from .github/secret-scan-flags, the single place this repo
        # declares them. That file is also what the two VENDORED workflows
        # (commit-message-scan.yml, issue-body-scan.yml) read, so the reason for
        # each flag is written once and cannot drift between four call sites --
        # which is exactly how the earlier copies here came to describe the
        # degraded mode incorrectly. Read that file for the rationale.
        run: |
          # shellcheck disable=SC2086  # flag list, must word-split
          python3 scripts/check-public-repo-secrets.py . $(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ')

      - name: Commit-message secret scan — push events (blocking)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # On a force-push the before-SHA sits on a rewritten (now-unreachable) line and
          # is absent from the checkout, so `git log <before>..HEAD` would exit 128 and red
          # the build for a non-content reason. Fall back to scanning the tip commit only
          # in that case (its message is the one the rewrite just introduced). BEFORE_SHA is
          # passed via env: (not inline interpolation) per workflow-injection hardening.
          if git rev-parse -q --verify "${BEFORE_SHA}^{commit}" >/dev/null 2>&1 \
             && git merge-base --is-ancestor "$BEFORE_SHA" HEAD 2>/dev/null; then
            SINCE="$BEFORE_SHA"
          else
            echo "::notice::before SHA $BEFORE_SHA unreachable (force-push/rewrite) - scanning HEAD commit only"
            SINCE='HEAD~1'
          fi
          # Flags from .github/secret-scan-flags — see the first scan step above.
          # shellcheck disable=SC2086  # flag list, must word-split
          python3 scripts/check-public-repo-secrets.py \
            $(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ') \
            --scan-commit-messages \
            --since "$SINCE"

      - name: Commit-message secret scan — PR events (blocking)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Flags from .github/secret-scan-flags — see the first scan step above.
          # shellcheck disable=SC2086  # flag list, must word-split
          python3 scripts/check-public-repo-secrets.py \
            $(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ') \
            --scan-commit-messages \
            --since ${{ github.event.pull_request.base.sha }}

      - name: Read pinned Hugo version
        id: hugo_version
        run: |
          if [ ! -f .hugo-version ]; then
            echo "::error::.hugo-version missing"
            exit 1
          fi
          V=$(cat .hugo-version | tr -d '[:space:]')
          if [ -z "$V" ]; then
            echo "::error::.hugo-version is empty"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo (pinned)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.hugo_version.outputs.version }}
          extended: true

      - name: Assert Hugo version matches .hugo-version
        run: |
          INSTALLED=$(hugo version | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')
          PINNED=${{ steps.hugo_version.outputs.version }}
          if [ "$INSTALLED" != "$PINNED" ]; then
            echo "::error::Hugo version drift: installed=$INSTALLED pinned=$PINNED"
            exit 1
          fi

      - name: Hugo cache
        uses: actions/cache@v5
        with:
          path: |
            resources/_gen
            /tmp/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('.hugo-version', 'content/**', 'assets/**', 'layouts/**', 'config/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Em-dash voice guard (zero tolerance)
        # Single source: scripts/check_emdash_zero_tolerance.sh \u2014 the SAME script the
        # check-emdash-zero-tolerance pre-commit hook runs, so local commit gate + CI
        # can never drift. Before the script existed this grep was CI-only, so an em
        # dash in unmarked docs prose passed pre-commit and silently froze the deploy
        # (blog-priv#38). Scope rationale (posts / meet-recorder / scripts exclusions)
        # lives in that script.
        run: bash scripts/check_emdash_zero_tolerance.sh

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --quiet -r requirements-dev.txt

      - name: EXIF detector (no identifying metadata in tracked images)
        run: python3 scripts/check-exif.py

      - name: EXIF detector unit tests
        run: python3 -m pytest scripts/test_check_exif.py -q

      # Template scan root added in #56, mirroring the pre-commit hook's files
      # pattern. The consent label in layouts/_partials/subscribe-form.html is the
      # first operator copy here to live outside a markdown file, and the guard is
      # marker-driven so ordinary templates collect and scan nothing.
      - name: Voice guard tells (marker-driven, new posts only)
        run: python3 scripts/check-ai-writing-tells.py --mode blog --check-only-new content/ docs/ layouts/

      - name: iamhoi wrapping guard (new posts) — CI mirror of pre-commit hook
        run: python3 scripts/check-iamhoi-wrapping.py --check-only-new

      - name: Em-dash guard (new posts, date-gated) — covers unmarked new-post prose
        run: python3 scripts/check_emdash_newposts.py

      - name: consulting.yaml OPERATOR_TODO guard — CI mirror of pre-commit hook
        run: |
          if [ -f data/consulting.yaml ] && grep -F OPERATOR_TODO data/consulting.yaml; then
            echo "::error::data/consulting.yaml contains OPERATOR_TODO placeholder; replace before commit"
            exit 1
          fi

      - name: Word-count ceiling
        run: |
          python3 scripts/check_wordcount.py $(git ls-files 'content/posts/*/index.md')

      - name: Voice guard unit tests
        run: python3 -m pytest scripts/test_voice_guard.py -q

      - name: Word-count hook unit tests
        run: python3 -m pytest scripts/test_check_wordcount.py -q

      - name: Internal-links + meet-recorder content unit tests
        run: python3 -m pytest scripts/test_validate_internal_links.py tests/test_meet_recorder_content.py -q

      - name: Em-dash new-post guard unit tests
        run: python3 -m pytest scripts/test_check_emdash_newposts.py -q

      - name: Config-traceability + iamhoi-wrapping unit tests
        run: python3 -m pytest scripts/test_check_config_traceability.py scripts/test_check_iamhoi_wrapping.py -q

      # Guards the newsletter email template's construction contract, and in
      # particular that its iamhoi markers are still present. The voice guard
      # reads that file but is default-SKIP, so stripped markers make it scan
      # nothing and report OK; this is the gate that turns red instead.
      # Source-only, so it runs before the Hugo build.
      - name: Newsletter email template gate + renderer unit tests
        run: python3 -m pytest scripts/test_check_newsletter_template.py scripts/test_newsletter_render.py -q

      # The sender's unit tier. Drives the real --prepare and --send entry points
      # against a mocked transport, asserting on the exact keyword arguments each
      # Brevo call would receive: a mock that swallowed **kwargs would accept any
      # payload and prove nothing about the wire format. Listed by name because CI
      # runs pytest through explicit file lists, so a file nobody lists never runs
      # (tests/test_gate_wiring.py fails the build for exactly that). Source-only
      # and network-free, so it runs before the Hugo build.
      - name: Newsletter sender unit tests
        run: python3 -m pytest tests/test_send_newsletter.py -q

      # The sender's E2E tier: render, create the draft, send the review copy, hand
      # the token back, fire sendNow. It RUNS here on every push, because the default
      # (BREVO_E2E unset) path drives that whole chain against a mocked transport with
      # urlopen booby-trapped, so a call escaping the mock fails the build rather than
      # mailing the operator. The live variant is opt-in and never touches list 4: it
      # creates its own throwaway contact list and deletes it in teardown.
      - name: Newsletter sender E2E tests
        run: python3 -m pytest tests/test_send_newsletter_e2e.py -q

      # The secret scan at the top of this job is blocking, but until #56 nothing
      # tested the guard itself in this repo. Its two collection paths asked
      # "should I open this file?" two different ways and neither opened an
      # extensionless config, so a token in .npmrc scored clean. Source-only, so
      # it runs before the Hugo build.
      - name: Public-repo secret guard unit tests
        run: python3 -m pytest scripts/test_check_public_repo_secrets.py -q

      # The shared coverage-floor module every gate's fail-loud path is built
      # on. It had no direct test until Ralph Tier 2 pointed out that a helper
      # whose job is to fail loudly is exactly the kind that stops doing so
      # silently. Source-only, so it runs before the Hugo build.
      - name: Gate-coverage helper unit tests
        run: python3 -m pytest scripts/test_gate_coverage.py -q

      # The 404 gate's noindex helpers, source-only so they run before the build.
      # SEPARATE from the `python3 scripts/test_404.py --built public` step further
      # down: that one invokes the file as a CLI, and a CLI run executes no test
      # functions. The distinction is load-bearing rather than pedantic, because
      # tests/test_gate_wiring.py is satisfied by the file being NAMED anywhere in
      # this workflow -- which the CLI step already does. So the gate that exists
      # to stop a test file going unrun would have reported this one as wired
      # while nothing ever ran it. blog-priv#64, Ralph round 2.
      - name: 404 noindex-rule unit tests
        run: python3 -m pytest scripts/test_404.py -q

      # The CTA button's cascade contract, scored from the stylesheet source so
      # it needs no browser and can run here. The shortcode emitted class="btn"
      # from launch with nothing defining it, and the obvious bare `.btn` fix
      # then LOSES to `.main a` (0-1-1 beats 0-1-0) and repaints it as an
      # underlined link. Both regressions fail this file. The browser-computed
      # half runs in pre-publish.sh, which is the lane that has Chromium, and
      # this file asserts that gate is wired. blog-priv#63.
      # test_check_cta_rendered covers the PURE helpers of the browser gate
      # (expected fill/label, whole-token class match, built-tree URL shaping).
      # Those decide what "correct" means, and they needed no browser, yet they
      # were reachable only through the manual Chromium lane until Ralph Tier 2
      # flagged the missing companion test. The browser half stays in
      # pre-publish.sh.
      - name: CTA button cascade + contrast unit tests
        run: python3 -m pytest scripts/test_cta_button.py scripts/test_check_cta_rendered.py -q

      # Its own step rather than an argument appended to the CTA line above:
      # tests/test_gate_wiring.py only checks that a test file is named after a
      # pytest token, so appending would satisfy the wiring gate while filing a
      # shortcode test under a CTA label. The shortcode is the only build-time
      # guard on the brochure's path (validate_internal_links.py strips
      # shortcode calls before scanning), so its contract gets its own name.
      - name: static-link shortcode contract (new tab + build-time file check)
        run: python3 -m pytest scripts/test_static_link_shortcode.py -q

      # The privacy notice names a third party on a consent basis, so it owes her
      # an accurate account of WHERE she is published. This enumerates the
      # surfaces that name her and requires the notice to cover each. It exists
      # because hoiboy-uk#59 shipped a notice that disclosed the brochure and was
      # blind to the page's own prose naming her, so a takedown performed exactly
      # as promised would have left her name, role and location live. Source-only
      # (it reads content/), so it runs before the build.
      - name: Partner disclosure surfaces (the notice covers every page naming her)
        run: python3 -m pytest tests/test_partner_disclosure_surfaces.py -q

      # The AGIT story counter says "keep writing" in red and "long enough" in
      # green, so those colours carry meaning and have to be legible on both
      # themes. No single hex can be: AA needs relative luminance <= 0.173550 on
      # the light background and >= 0.206479 on the dark, an empty set. This
      # scores every colour in the page's inline <style> against the background
      # it is actually painted on. It caught .agit-notice already failing at
      # 2.82:1 before the counter existed. Source-only, so it runs here rather
      # than in the Chromium lane. hoiboy-uk#57.
      - name: AGIT form colour contrast unit tests
        run: python3 -m pytest scripts/test_agit_counter_contrast.py -q

      # The pure decision logic of the browser gate: what counts as red, green
      # and blocked. The browser half stays in pre-publish.sh, the only lane
      # with Chromium, which is exactly how the CTA gate ended up with its
      # helpers reachable only through a manual run until Ralph Tier 2 flagged
      # the missing companion. Not re-creating that gap here. hoiboy-uk#57.
      - name: AGIT counter gate helper unit tests
        run: python3 -m pytest scripts/test_check_agit_form_counter.py -q

      # test_gen_card and test_check_svg_dimensions are source-only (no built tree)
      # and were in NO pytest invocation until blog-priv#62 -- the same "a file nobody
      # lists never runs" class documented below at the frontmatter step. blog-priv#62
      # rewrote gen_card.py's eyebrow path, so their SUT changed while their coverage
      # was inert. tests/test_gate_wiring.py now asserts no test file can go unlisted.
      - name: Social-card guard unit tests
        run: |
          python3 -m pytest scripts/test_check_social_cards.py \
            scripts/test_gen_card.py scripts/test_check_svg_dimensions.py -q

      # Cloudflare reclassifies Googlebot/Applebot/BingBot as blocked on
      # 2026-09-15 for any zone that has selected to block Training. These zones
      # have. So a setting that is correct today becomes an SEO outage on a
      # known date unless somebody decides first, and no repo change would show
      # it. This step goes red from 2026-09-01 while the decision marker in
      # docs/research/17_AI_CRAWLER_FRAMEWORK.md still reads `pending`.
      #
      # It is listed here BY NAME on purpose: the first version of this gate
      # shipped documented as "not advice in a document; it is a gate" while no
      # workflow invoked it, which is the same defect the frontmatter comment
      # below describes. Ralph caught it. A guard nothing runs guards nothing.
      - name: AI-training migration deadline gate
        run: python3 scripts/check_ai_training_deadline.py

      - name: AI-training deadline gate unit tests
        run: python3 -m pytest scripts/test_check_ai_training_deadline.py -q

      # Posts require title/date/categories/tags/description; project pages
      # under content/hire-hoi/ require title/description. `description` is
      # REQUIRED since blog-priv#55 Phase 2: without it a page inherits the
      # site-default meta description and ships as a near-duplicate. SEO
      # hygiene, not a GEO lever. This step covers the posts tree only; the
      # project-page tree is the separate, disjoint step below.
      - name: Frontmatter validator (posts, incl. description)
        run: python3 scripts/validate_frontmatter.py --scope posts

      # Disjoint from the posts step above; the two together cover the whole
      # tree exactly once. They were previously nested (a bare whole-tree run,
      # then a subset re-run), which made this step unable to fail
      # independently. `if: always()` is load-bearing: without it GHA skips
      # this step whenever the posts step failed, and now that the scopes are
      # disjoint that would drop project-page coverage entirely rather than
      # just lose an attribution label. Guarded by tests/test_gate_wiring.py.
      - name: Frontmatter validator (project pages, incl. description)
        if: always()
        run: python3 scripts/validate_frontmatter.py --scope consulting

      - name: Config traceability check
        run: python3 scripts/check_config_traceability.py

      - name: Validate internal markdown links
        run: python3 scripts/validate_internal_links.py

      - name: Social-card guard (every singular page owns its og:image card)
        run: python3 scripts/check_social_cards.py

      # hoiboy-uk#54 AC 3.2. Adding a service means editing a page bundle AND a
      # `## <Service>` block on the section landing, and nothing connected the two:
      # the 4th service shipped with its block but no propagation, and a 5th bundle
      # with no block at all would have been just as invisible.
      - name: Landing-sync guard (section landing lists exactly the service bundles)
        run: python3 scripts/check_landing_sync.py

      # The mutation tests for the guard above. Listed by name because CI runs pytest
      # through explicit file lists, so a file nobody lists never runs (the defect
      # blog-priv#62 found in test_404.py, which collected zero tests for its whole life).
      - name: Landing-sync guard mutation tests
        run: python3 -m pytest scripts/test_check_landing_sync.py -q

      - name: Setup Node (meet-recorder JS tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci

      - name: meet-recorder JS tests
        run: npm test

      - name: Hugo build (production)
        run: |
          hugo --gc --minify -e production 2>&1 | tee /tmp/hugo-build.log
          # Bidirectional warning allowlist check (strip absolute paths for portability)
          ACTUAL=$(grep -iE 'warn|error' /tmp/hugo-build.log | sed 's|"/[^"]*/content/|"content/|g' | sort -u || true)
          ALLOWED=$(grep -v '^#' .hugo-warning-allowlist | grep -v '^$' | sort -u || true)
          NEW=$(comm -23 <(echo "$ACTUAL") <(echo "$ALLOWED"))
          DEAD=$(comm -13 <(echo "$ACTUAL") <(echo "$ALLOWED"))
          if [ -n "$NEW" ]; then
            echo "::error::New Hugo warnings outside allowlist:"
            echo "$NEW"
            exit 1
          fi
          if [ -n "$DEAD" ]; then
            echo "::error::Dead allowlist entries (no longer in build):"
            echo "$DEAD"
            exit 1
          fi

      - name: Secret detection — BUILT OUTPUT (blocking)
        # The source scan above cannot see this tree, and that gap was real, not
        # theoretical: planting an address in public/ and re-running the source
        # scan reports "PASS: No secrets detected". Everything between a clean
        # source file and the HTML actually served was ungated.
        #
        # --include-ignored is REQUIRED here. public/ is gitignored (it is a
        # build artefact), so the default filter drops all of it, and the
        # coverage floor then exits 2 rather than reporting a false clean.
        #
        # Runs AFTER the Hugo build step above, against the same tree that is
        # deployed. A leak reachable only through a template, a data file, a
        # shortcode or a partial shows up here and nowhere else.
        # Kept on ONE line: tests/test_gate_wiring.py proves this step can fail
        # the build by injecting `continue-on-error: true` at its indent, and that
        # mutation only works while the command is a plain `run:` scalar. Inside a
        # `run: |` block the injected line would be shell, not YAML, and the guard
        # would stop measuring what it claims to.
        run: python3 scripts/check-public-repo-secrets.py public --include-ignored $(sed -e 's/#.*//' .github/secret-scan-flags | tr '\n' ' ')

      - name: Social-card guard (rendered og:image — template-regression backstop)
        # --require-trails: this job built the tree in an earlier step, so a
        # missing trail.json means the build is stale, not that this is a
        # fixture. Without it the rendered og:image tier silently downgrades
        # to a source-only run and injected template regressions walk through.
        run: python3 scripts/check_social_cards.py --built public --require-trails

      # Reads the BUILT tree. The suppression predicate in footer.html reaches
      # every page kind through the single shared shell in baseof.html, so a
      # wrong predicate ships site-wide and no source-level grep can prove
      # placement. Must run AFTER the Hugo build step above, never in the
      # source lane. #56 AC 2.2a.
      - name: Subscribe-form placement (suppressed on five classes, present elsewhere)
        run: python3 scripts/check_subscribe_placement.py --built public

      # Its own tests. The gate's "did this prove anything" floor was AGGREGATE
      # across all suppressed classes, so a tree predating /newsletter/ still
      # counted the legal, private and AGIT pages and the newsletter suppression
      # rule -- the one this Issue exists to enforce -- was never exercised while
      # the gate reported clean. Found by the #56 Ralph escalation class sweep.
      - name: Placement gate's own tests (per-class suppression floor)
        run: python3 -m pytest scripts/test_check_subscribe_placement.py -q

      # An X-Robots-Tag noindex stops indexing, not publishing. Without the
      # companion frontmatter Hugo puts a noindex page's FULL BODY into
      # public/index.xml, the feed every page advertises, so it arrives in
      # subscribers' readers as a post. Third occurrence in this repo, which is
      # why it is now a gate rather than a comment. Needs the built tree.
      - name: Noindex pages stay out of the sitemap and the RSS feed
        run: python3 scripts/check_noindex_frontmatter.py --built public

      # The gate above shipped with no test of any kind, was wired into three
      # surfaces, and was reviewed six times before the #56 Ralph escalation
      # class sweep found two defects in it that no green run could have
      # surfaced: a second, divergent static/_headers parser, and no
      # build-freshness floor (it reported "4 rules enforced ... no leaks"
      # against a tree that predated a whole noindex route). Both are the same
      # shape -- a gate reporting success for a surface it did not examine --
      # and neither was reachable by inspection. Reads the built tree, so it
      # sits after the Hugo build with the other built-tree suites.
      - name: Noindex gate's own tests (parser reuse + build-freshness floor)
        run: python3 -m pytest scripts/test_check_noindex_frontmatter.py -q

      # Reads the BUILT tree: asserts Hugo emitted public/404.html, that the
      # template's content block actually rendered, and that every navigation
      # link ON the 404 page resolves. Without a root 404.html Cloudflare Pages
      # soft-404s every dead URL as HTTP 200. blog-priv#64.
      - name: 404 gate (no soft-404; the 404 page's own links resolve)
        run: python3 scripts/test_404.py --built public

      # Both read the BUILT tree, so they sit after the Hugo build, not with the
      # source-only unit tests above. Listed by name because CI runs pytest
      # through explicit file lists: a test file nobody lists never runs, which
      # is how tests/test_gate_wiring.py sat dead until a Stage 5 audit found it.
      #
      # test_trail_manifest asserts every carded page owns a trail.json and that
      # each one equals its page's own rendered breadcrumb, which is what keeps
      # the card eyebrows and the on-page breadcrumb derived from one rule.
      # test_breadcrumb_levels asserts the Blogs crumb is on every post and
      # category landing and on NO other page, scoped to the breadcrumb nav.
      - name: Trail sidecar + breadcrumb level tests (built tree)
        run: python3 -m pytest scripts/test_trail_manifest.py scripts/test_breadcrumb_levels.py -q

      # The card-eyebrow half of the same contract. test_eyebrow_render asserts the
      # exact eyebrow TEXT per named page (the operator's one explicit ask, which
      # every other Phase-3 check leaves unfalsifiable) and that the generators join
      # on the content path, so a permalink change cannot silently break the lookup.
      # test_eyebrow_width asserts each eyebrow fits its own card geometry with
      # nothing clipped. test_card_build_order pins the two-pass build and executes
      # the fail-loud path rather than reading it.
      - name: Card eyebrow + build-order tests (built tree)
        run: python3 -m pytest scripts/test_eyebrow_render.py scripts/test_eyebrow_width.py scripts/test_card_build_order.py -q

      # The /blogs/ URL contract. test_permalink_contract asserts all 87 retired
      # URLs map 1:1 onto live ones under the two-rule mapping (the redirect set is
      # the only thing keeping 39 files of cross-repo links alive, including a
      # submitted funding application). test_redirects_order pins the ai-jargon
      # alias ABOVE the wildcard that would swallow it, 301-only, no chains.
      # test_redirects_coverage resolves every retired URL, canonical AND
      # slash-less, against the built tree. test_hub_listing asserts /blogs/ is a
      # real page inside <main> (a document-wide check passes on the empty state,
      # because the sidebar carries all 7 category links on every page).
      # test_page_url_permalinks pins the check_social_cards derivation that
      # silently skipped 87 pages. test_section_keyed_regression covers the 6
      # .Section-keyed sites. test_taxonomy_cleanup asserts the categories: front
      # matter key SURVIVES on all 79 posts. test_emdash_hub_coverage mutation-tests
      # that the hub landing is inside the em-dash guard despite living in the
      # legacy-exempt content/posts directory. test_related_ranking asserts the
      # Read Next box is ordered by shared-tag count (blog-priv#66) - the box is
      # otherwise only covered by test_section_keyed_regression, which asserts it
      # EXISTS and holds a link, so a ranking returning five arbitrary posts on
      # every page would pass. readnext_parse carries its own smoke test over
      # every post's front matter; it is the shared parser both the ranking test
      # and the Phase 0 baseline use, so it is listed explicitly rather than left
      # to be collected by name.
      - name: Blogs IA tests (URLs, redirects, hub, taxonomy)
        run: |
          python3 -m pytest scripts/test_permalink_contract.py scripts/test_redirects_order.py \
            scripts/test_redirects_coverage.py scripts/test_hub_listing.py \
            scripts/test_page_url_permalinks.py scripts/test_section_keyed_regression.py \
            scripts/test_taxonomy_cleanup.py scripts/test_emdash_hub_coverage.py \
            scripts/readnext_parse.py scripts/test_related_ranking.py \
            tests/test_taxonomy_terms_match_build.py -q

      # #55 AC 2.1/2.4: the suite above now ALSO runs pre-push, via the
      # blogs-ia-suite hook in .pre-commit-config.yaml. Two callers naming two
      # lists is how a test ends up enforced in one place and silently unrun in
      # the other, so this asserts the two lists are set-equal, and that the
      # runner still names the files that need a built ./public in its
      # missing-tree message rather than emitting a traceback.
      - name: Blogs IA pre-push gate unit tests
        run: python3 -m pytest scripts/test_run_blogs_ia_suite.py -q

      # blog-priv#81 AC 6.2. Keeps the voice-guard markers out of the XML feeds,
      # where Hugo's embedded RSS template used to escape them into visible text.
      # Needs the built ./public, so it sits after the Hugo build. Deliberately its
      # OWN step rather than appended to the Blogs IA list above: that list is held
      # set-equal to the pre-push runner's by scripts/test_run_blogs_ia_suite.py,
      # and adding a file to one side only would fail that contract.
      - name: Feed marker regression gate (built tree)
        run: python3 -m pytest tests/test_feed_markers.py -q

      # #55 Phase 4, the root-cause gate. exclude_path is a list of unanchored
      # REGEXES, and an over-broad entry fails silently: lychee reports 0 Total
      # and "No files found for this input source", which reads like a missing
      # file. Three separate entries have shipped that way (docs/research,
      # public/blogs, then .git matching agit). This asserts every entry still
      # excludes what it is for AND leaves near-miss paths checkable, and fails
      # when an entry is added with no corpus rather than letting it go untested.
      - name: Lychee exclude_path governance
        run: python3 -m pytest scripts/test_lychee_exclude_path.py -q

      # #55, Ralph Tier 2. rendered-link-liveness reads a page's BUILT html, and
      # getting that path wrong has failed three ways, each passing something
      # rather than erroring: a taxonomy page sorting first, a section whose url
      # prefix differs (posts -> /blogs/), and a frontmatter url: override that
      # replaces the whole path. This pins the resolution contract.
      - name: Rendered-path resolution contract
        run: python3 -m pytest scripts/test_pre_publish_rendered_path.py -q

      # blog-priv#62: posts and the 7 category landings moved under /blogs/, so
      # these paths are the NEW contract. The retired ones are asserted too, from
      # the opposite direction: they must NOT be built, or a stale template would
      # keep serving a duplicate at the old URL while its 301 also fires, and the
      # canonical would be ambiguous. `tags` is deliberately unmoved (A11).
      - name: URL contract assertion
        run: |
          set -e
          for p in food-booze adventure dance tech-ai life entrepreneurship trading; do
            test -f "public/blogs/$p/index.html" || { echo "::error::missing /blogs/$p/index.html"; exit 1; }
            test ! -e "public/$p" || { echo "::error::retired /$p/ still built; it must only exist as a 301"; exit 1; }
          done
          test -f "public/blogs/index.html" || { echo "::error::missing /blogs/ hub"; exit 1; }
          test -f "public/tags/index.html" || { echo "::error::missing /tags/index.html"; exit 1; }
          test -f "public/index.html" || { echo "::error::missing root index.html"; exit 1; }
          test -f "public/index.xml" || { echo "::error::missing root RSS feed"; exit 1; }
          test -f "public/sitemap.xml" || { echo "::error::missing sitemap.xml"; exit 1; }
          test -f "public/robots.txt" || { echo "::error::missing robots.txt"; exit 1; }
          test -f "public/blogs/foundation/index.html" || { echo "::error::missing foundation post"; exit 1; }
          test -f "public/tags/foundation/index.html" || { echo "::error::missing foundation tag page"; exit 1; }
          echo "URL contract OK"

      - name: RSS validates locally + jq schema asserts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils jq
          xmllint --noout public/index.xml
          xmllint --noout public/sitemap.xml

      # test_gate_wiring.py asserts the content roots main() ACTUALLY walks, so a
      # root silently dropped from the gate fails here. It was delivered by
      # blog-priv#55 and referenced at line 176 as the thing guarding that
      # attribution, but it was never added to any pytest invocation: CI runs
      # pytest through explicit file lists, so a file nobody lists never runs.
      # A guard that cannot fail guards nothing, which is the exact defect class
      # this issue spent 24 Ralph rounds on. Caught by the Stage 5 audit.
      - name: Frontmatter parser unit tests
        run: python3 -m pytest scripts/test_validate_frontmatter.py tests/test_gate_wiring.py -q

      # Consent-label version traceability (agit-ops#3 AC 1.9). Three surfaces have
      # to agree and nothing at runtime couples them: the hidden input in the AGIT
      # form, KNOWN_CONSENT_VERSIONS in functions/api/contribute.js, and the
      # lock-step mirror of that list in tests/contribute.test.js. Bump one and not
      # the others and every submission 400s, silently, until someone reports it.
      # Source-only, so it runs before the Hugo build.
      - name: AGIT consent-version traceability
        run: python3 -m pytest tests/test_agit_consent_version.py -q

      # The same invariant for the second consent surface (#56 AC 4.3): the hidden
      # input in layouts/_partials/subscribe-form.html, KNOWN_CONSENT_VERSIONS in
      # functions/api/subscribe.js, and the mirror in tests/subscribe.test.js. A
      # sibling rather than a generalisation because the two surfaces share their
      # parsing (tests/consent_version_surfaces.py) but not their assertions: AGIT
      # evidences consent in an emailed record, this one in a Brevo contact
      # attribute. Source-only, so it runs before the Hugo build.
      - name: Newsletter consent-version traceability
        run: python3 -m pytest tests/test_newsletter_consent_version.py -q

      # The two Pages Functions are self-contained edge modules with no shared
      # import, so several helpers exist twice on purpose. This is what stops the
      # copies drifting. The #56 review found both files trusting a client-supplied
      # content-length as a size bound; fixing one and not the other is precisely
      # the outcome this gate now prevents. Source-only, runs before the build.
      - name: Edge-function helper parity (duplicated helpers stay in lock-step)
        run: python3 -m pytest tests/test_edge_function_parity.py -q

      # Mutation tests: put each defect back and require its own test to go red.
      # Ralph ran nine rounds on blog-priv#63/#64 and could not terminate, because
      # the acceptance criterion looked BACKWARDS - a corpus of mutations each
      # named after a defect already found. Five separate times in that workstream
      # a test asserted a HELPER rather than the WIRING, so reverting the real
      # call site left the suite green. Every one was caught by reintroducing the
      # defect and none by reading the diff. This step makes that check automatic.
      # It rewrites repo files in place and restores them, which is safe on an
      # ephemeral CI checkout and is asserted clean by its own last test.
      - name: Gate mutation tests (guards must fail when their defect returns)
        run: python3 -m pytest tests/test_gate_mutations.py -q

      # The companion to the step above, asking the opposite question. Mutation
      # tests prove a guard fires when its defect RETURNS; this proves a guard
      # cannot report success when it examined NOTHING. #56 shipped eleven
      # instances of the second class -- a gate printing a confident OK over a
      # surface set that had silently shrunk to zero -- and each individual fix
      # left the class alive on a surface it had not enumerated. Enrolment is by
      # existence, so a gate added later is covered without anyone remembering.
      - name: Gate vacuity tests (guards must fail when they examined nothing)
        run: python3 -m pytest tests/test_gate_vacuity.py -q

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          config: .markdownlint.json
          globs: |
            content/**/*.md
            !content/posts/**
            docs/**/*.md
            README.md

      # Runs on every push, not just when lychee.toml changes: the failure mode
      # is the passage of time, so a repo nobody touches is exactly where an
      # entry goes stale. lychee.toml's header claimed CI enforced this and
      # nothing did, until an entry sat 13 days past expiry (blog-priv#55
      # Stage 5). Ordered before the link check so the reason a URL is being
      # skipped is re-confirmed before it is skipped.
      - name: Lychee allowlist expiry
        run: python3 scripts/check_lychee_expiry.py

      - name: Lychee allowlist expiry unit tests
        run: python3 -m pytest scripts/test_check_lychee_expiry.py -q

      # Exit-contract tests for the crawler probe. Hermetic: they stand up a
      # local UA-aware HTTP server, so all three exits are produced offline.
      # The probe's only prior evidence was a live run against the production
      # edge, which cannot yield a PASS while Cloudflare blocks the citation
      # class, and cannot yield the inconclusive case at all.
      - name: AI crawler probe exit-contract tests
        run: python3 -m pytest scripts/test_check_ai_crawler_access.py -q

      # Wiring guard for the vendored drift-check pair (check-mirror-drift.py +
      # sst3_mirror_utils.py). Listed explicitly because CI runs pytest through
      # named file lists, not a directory sweep, so a test file nobody lists
      # never runs. That is the exact hole a gate-wiring test fell through
      # earlier in this issue, and the half-sync this guard catches is what
      # Ralph round 9 found, so leaving it CI-orphaned would be the same defect
      # twice.
      - name: Vendored drift-check pair wiring tests
        run: python3 -m pytest scripts/test_check_mirror_drift_wiring.py -q

      # ZERO-LINK FLOOR: already present, supplied by the ACTION, not by this file.
      # Documented here because a #55 Stage-5 audit angle read only these five lines,
      # found no Total assertion, and reported the step as the one unfloored lychee
      # caller. It is not: lychee-action's `failIfEmpty` input DEFAULTS TO TRUE, and
      # its entrypoint greps lychee's MARKDOWN summary for `Total\s+\|\s+0` and fails
      # the pipeline when it matches ("No links were found. This usually indicates a
      # configuration error."). Verified against lycheeverse/lychee-action action.yml
      # (failIfEmpty default: true) and entrypoint.sh (the grep) on 2026-08-02.
      #
      # CONSEQUENCE, and the reason this comment is long: that floor is implemented
      # against the MARKDOWN output. Adding `--format json` here to make the count
      # machine-readable REMOVES the floor -- the JSON payload has no `Total | 0`
      # table row for the grep to match -- while looking like it adds one. That was
      # tried in this Issue and reverted. Do not set `format:`/`--format` on this step
      # without replacing the floor it silently deletes.
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.md'
          fail: true
          # failIfEmpty defaults to true; stated explicitly so the floor is visible
          # in this file rather than only in the action's defaults.
          failIfEmpty: true

      - name: Cache hygiene
        if: always()
        run: |
          if [ -d resources/_gen ]; then
            find resources/_gen -atime +30 -delete 2>/dev/null || true
          fi

      - name: Upload public artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7
