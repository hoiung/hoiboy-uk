# Hugo site config. Single source of truth.
# Hugo version: pinned in /.hugo-version (read by CI and Cloudflare).
# Theme: NONE. We ship a minimal custom theme inside layouts/ + assets/.

baseURL = "https://hoiboy.uk"
languageCode = "en-gb"
# UK site: interpret frontmatter dates in London time, not UTC. Without this,
# a post dated YYYY-MM-DD published just after UK midnight (but before UTC
# midnight) reads as future and Hugo drops it from the production build
# (buildFuture defaults false). Europe/London = BST/GMT as appropriate.
timeZone = "Europe/London"
title = "hoiboy.uk"
enableRobotsTXT = true
enableEmoji = false
disableHugoGeneratorInject = true

# Build hardening
[build]
  noJSConfigInAssets = true

# Per-page trail sidecar (blog-priv#62). Every rendered page emits
# public/<url>/trail.json carrying its content path, title, parent trail and
# served URL; the social-card generators read it so a card eyebrow and the
# on-page breadcrumb derive from one rule instead of two hand-kept copies.
#
# A per-page OUTPUT FORMAT is emitted per rendered page, not per page-collection
# member, which is why it is used here in place of a single site-wide manifest:
# content/hire-hoi/permanent-roles/index.md sets `build.list: never`, so it
# belongs to no Hugo page collection (absent from the sitemap and from any
# collection-driven manifest) yet it renders and it IS carded.
[outputFormats.trails]
  mediaType = "application/json"
  baseName = "trail"
  isPlainText = true

# Output formats: HTML + RSS + sitemap (Hugo defaults) + the trails sidecar.
# `page` is listed explicitly because its default is HTML-only. Taxonomy and
# term pages emit no trail: they are generated, hold no content bundle, and are
# never carded.
[outputs]
  home = ["HTML", "RSS", "trails"]
  page = ["HTML", "trails"]
  section = ["HTML", "RSS", "trails"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# Tags primary, series secondary. Per docs/research/06_TAXONOMY.md.
#
# There is deliberately NO `category` taxonomy (blog-priv#62 Phase 6). It used to
# map to "categories" and produced 8 indexable /categories/* URLs that listed the
# same posts as the /blogs/<category>/ landings, were not noindex, rendered the
# literal word "Categories", and carried mangled auto-titles ("Tech-Ai"). Two
# indexable pages listing identical content compete with each other; the landings
# win because they are hand-titled and now sit at the canonical /blogs/ URL.
# /categories/* 301s into /blogs/* in static/_redirects.
#
# What this removes is the TAXONOMY MAPPING only. The `categories:` front-matter
# key stays on all 79 posts and is load-bearing: layouts/_partials/breadcrumb-trail.html,
# layouts/_partials/related-posts.html, layouts/_default/list.html and
# layouts/_default/single.html all read .Params.categories, so stripping the key
# would empty every category landing and break the post breadcrumb.
# Asserted by scripts/test_taxonomy_cleanup.py.
#
# `series` taxonomy added 2026-04-26 (Issue #3) for grouping multi-post sequences
# (bake-off teaser + future results posts). Term page renders via
# layouts/series/term.html (Hugo lookup chain: series/term.html >
# _default/term.html > _default/taxonomy.html). Posts opt-in via
# `series: <name>` + `order: <int>` frontmatter.
[taxonomies]
  tag = "tags"
  series = "series"

# Permalinks. Posts and the 7 blog categories live under /blogs/ (blog-priv#62):
# `Blogs` is a real level in the information architecture, so it is a real level
# in the URL too, instead of category landings sitting at the root competing with
# /hire-hoi/ and /legal/. Every retired URL is 301'd in static/_redirects.
#
# `:slugorcontentbasename` is load-bearing and is NOT interchangeable with
# `:slug`. It reproduces Hugo's own default for this section (frontmatter `slug:`
# when set, else the content directory name); `:slug` alone falls back to a
# title-derived string and silently rewrites 51 of the 82 post URLs, which builds
# clean and emits the same URL count while breaking the 1:1 redirect mapping.
# `:filename` was removed in Hugo 0.144+ and hard-fails the build.
# Asserted by scripts/test_permalink_contract.py.
#
# The 7 category sections are listed individually because a section permalink
# pattern is a literal path, not a prefix rule. Categories still use section
# landings rather than a taxonomy permalink rewrite (avoids the section vs
# taxonomy collision); the redundant `categories` taxonomy itself is switched off
# further up in [taxonomies].
[permalinks.page]
  posts = "/blogs/:slugorcontentbasename/"
[permalinks.section]
  posts = "/blogs/"
  tech-ai = "/blogs/tech-ai/"
  entrepreneurship = "/blogs/entrepreneurship/"
  trading = "/blogs/trading/"
  food-booze = "/blogs/food-booze/"
  adventure = "/blogs/adventure/"
  dance = "/blogs/dance/"
  life = "/blogs/life/"
[permalinks.term]
  tags = "/tags/:slug/"

# Pagination default. blog-priv#62 removed the `category` taxonomy, so the 7 blog
# categories are section landings at /blogs/<cat>/ rather than taxonomy term pages;
# the taxonomies that remain are tags and series. Currently inert either way: no
# layout calls .Paginate or .Paginator, and Hugo reports 0 paginator pages. Kept as
# the ceiling that would apply if a list template ever starts paginating.
[pagination]
  pagerSize = 50

# Minify: keep quotes on integrity/crossorigin attributes (SRI)
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true

[markup]
  [markup.goldmark.renderer]
    # Raw HTML allowed: meet-recorder tool page (consulting-ops#8) embeds form HTML
    # inline so AC 1.3 grep-count for data-runbook-step lands on index.md, not on a
    # layout/shortcode. hoiboy-uk content is operator-authored only - no user-generated
    # input pipeline that would make this risky. (Conflict-merge with main 2026-05-10:
    # main also enabled unsafe=true for sub-processors-table wrapper div; behaviours
    # are identical, comment kept for traceability.)
    unsafe = true
  [markup.highlight]
    style = "github"
    noClasses = false
    lineNos = false
