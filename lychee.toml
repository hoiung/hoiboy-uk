# Link checker config. ALL link failures are FAIL.
# Known-flaky external domains go in the exclude list below.
# Each entry MUST have an "added: YYYY-MM-DD; expires: YYYY-MM-DD (90 days)" comment.
# One comment governs the run of same-class entries beneath it.
# CI FAILS when an entry is past expiry: scripts/check_lychee_expiry.py, run by
# pre-commit and by ci.yml. This line previously said "warns" and nothing
# implemented it at all, so an entry sat 13 days past expiry unnoticed
# (blog-priv#55 Stage 5). Warning was effectively the old behaviour.

include_verbatim = false
no_progress = true
max_concurrency = 4
max_redirects = 5
timeout = 20
retry_wait_time = 2
accept = [200, 201, 202, 203, 204, 301, 302, 307, 308]

# Base URL for resolving root-relative links (href="/js/...") found in raw
# markdown. Hugo rewrites these at render but lychee scans raw .md and would
# otherwise fail with "Cannot convert path to URI: To resolve root-relative
# links in local files, provide a root dir". Resolved URLs go through the
# hoiboy.uk allowlist exclude below, so the production site doesn't get
# hammered by CI -- the path-construction just has to succeed.
base_url = "https://hoiboy.uk"

# Input paths to skip. Each value is an UNANCHORED REGULAR EXPRESSION matched
# against the input path as lychee receives it -- NOT a glob. This matters more
# than it looks: `.` is the regex any-character, so a naive `.git` also matches
# `agit`, and CI passes `./**/*.md` so paths arrive `./`-prefixed while
# pre-publish.sh passes them bare. Any entry added here must be checked against
# BOTH invocation forms and against near-miss paths that must stay checkable.
# scripts/test_lychee_exclude_path.py holds that contract.
#
# `public/hire-hoi/ai-consultancy` is INTENTIONALLY NOT excluded so
# consulting-ops#2 AC 0.4 (Cal.com URL liveness) can fire against the rendered
# consulting page HTML.
#
# `docs/research` WAS excluded and is not any more (blog-priv#55 Stage 5).
# The exclusion silently voided every citation in the research corpus: ci.yml
# invokes lychee over './**/*.md', which looks like it covers these files, and
# this line removed them again. It is stronger than a glob filter, too: passing
# a research file to lychee EXPLICITLY still produced "No files found for this
# input source", so nothing could check them by any invocation.
#
# It was found because a Sources URL in 17_AI_CRAWLER_FRAMEWORK.md had been a
# stable 404 for the life of the file, in the layer the document names as the
# only enforcement mechanism actually in effect. Measured before removing the
# exclusion: 85 links, 73 unique, 3 errors, and all 3 were anti-bot 403s from
# publishers, now allowlisted below rather than left to fail. Whenever a gate
# appears to cover a file, prove the file is in scope, not merely that the gate
# runs.
# `public/blogs` WAS excluded here and is not any more (#55). It was the same
# defect as `docs/research` above, two lines below the paragraph recording that
# lesson: scripts/pre-publish.sh passes the rendered post path to lychee
# EXPLICITLY, and this key voids even an explicit invocation, so the
# rendered-link-liveness gate reported `0 Total` and exit 0 for every post from
# blog-priv#62 until #55. Measured on one post: 0 Total with the entry present,
# 46 Total / 37 Unique without it. Across the corpus once removed: 5036 links,
# 1169 unique, and 14 errors + 1 timeout that no tier had ever seen.
#
# `content/posts` STAYS. It is the CONTENT path, not the built output, and
# dropping it re-enables raw-markdown link checking over the voice-sacred legacy
# corpus (scripts/test_permalink_contract.py states this). Its provenance is a
# dated 2026-04-08 decision record. Deliberately out of scope for #55.
#
# The VCS entry is `(^|/)\.git(/|$)`, not `.git` (#55). As a bare `.git` it was
# the any-character defect this header warns about, and it silently voided all
# 18 tracked `agit` paths: the AGIT consent surfaces under content/legal and
# content/community, docs/runbooks/agit-erasure.md, and the rest. Measured on
# content/community/agit-thanks/index.md: 0 Total before, 11 Total after.
# The `(^|/)` and `(/|$)` boundaries are load-bearing and a plain `^` anchor is
# NOT a substitute -- CI passes `./**/*.md`, so a real VCS path arrives as
# `./.git/...` and `^\.git` does not match it, which disables the exclusion
# rather than tightening it. Measured on ./.git/hooks/note.md: `^\.git` gives
# 1 Total (leaked), `(^|/)\.git(/|$)` gives 0 Total (excluded).
#
# EVERY entry is boundary-anchored as `(^|/)<path>(/|$)` (#55 Phase 4). `.git`
# was the instance that fired, but it was not special: as bare substrings,
# `legacy` also matched docs/legacy-migration.md, `node_modules` matched
# docs/node_modules-policy.md, `content/posts` matched content/postscript.md,
# and `scripts/tests/fixtures` matched scripts/tests/fixtures-readme.md. Each
# would have been silently unchecked with no warning beyond "No files found for
# this input source". Fixing only `.git` would have left four loaded guns.
# The tightening is behaviour-preserving and was measured, not assumed: across a
# 3370-path corpus (all tracked files + the built public/ tree + every path in
# its `./`-prefixed CI form) the bare and the anchored arrays exclude the SAME
# 1102 paths. scripts/test_lychee_exclude_path.py holds the contract: every
# entry needs a path it must still exclude AND a near-miss it must not, and an
# entry added without that corpus fails the suite rather than passing untested.
exclude_path = ["(^|/)legacy(/|$)", "(^|/)node_modules(/|$)", "(^|/)\\.git(/|$)", "(^|/)content/posts(/|$)", "(^|/)scripts/tests/fixtures(/|$)"]

# Domains explicitly excluded from link check (allowlist).
# Add entries with the comment format above. Empty by default.
exclude = [
  # Self-reference: README.md points at the live site, lychee then fetches
  # hoiboy.uk during CI which races against the same Cloudflare deploy that
  # the commit is about to trigger. Causes intermittent timeouts under load.
  # No value in self-checking; Hugo build + URL contract assertion already
  # validate the live site shape. Re-confirmed 2026-07-20 (blog-priv#55 Stage 5):
  # the deploy race is structural, not a transient, so the exclusion still holds.
  # added: 2026-04-08; expires: 2027-01-12 (90 days)
  # Re-confirmed 2026-10-14: still structural (the deploy race), renewed.
  "^https?://(www\\.)?hoiboy\\.uk(/.*)?$",
  # LinkedIn returns HTTP 999 (anti-bot rate-limit) to lychee's user-agent,
  # which is not a real HTTP status. Sidebar profile link cannot be liveness-
  # checked from CI without a logged-in cookie. STRUCTURAL, not a transient outage:
  # re-probed 2026-08-02 and LinkedIn still answers 999 to an anonymous request.
  # This entry is expected to be renewed, not deleted, until lychee can present a
  # cookie. added: 2026-08-02; expires: 2027-01-12 (90 days)
  # Re-probed 2026-10-14: lychee still gets 999 from LinkedIn. Renewed.
  "^https?://(www\\.)?linkedin\\.com(/.*)?$",
  # Meetup, Facebook and Instagram return 403/999 (anti-bot) to lychee's
  # user-agent, same class as linkedin above. Community join links on
  # /community/asians-gingers-in-tech/ (#43). Verified reachable in-browser
  # (200/308) 2026-07-10. added: 2026-07-10; renewed 2026-10-14: re-probed from a
  # residential IP with lychee's user-agent, meetup 308 and facebook/instagram 200,
  # but meetup's own assets answer lychee 403, the same anti-bot class; CI runs from
  # GitHub runner IPs, which a local probe cannot reproduce. Renewed, not deleted,
  # same shape as linkedin above. expires: 2027-01-12 (90 days)
  "^https?://(www\\.)?meetup\\.com(/.*)?$",
  "^https?://(www\\.)?facebook\\.com(/.*)?$",
  "^https?://(www\\.)?instagram\\.com(/.*)?$",
  # TikTok and X (Twitter) return 403/anti-bot to lychee's user-agent, same
  # class as the community links above. /community/asians-gingers-in-tech/ (#43).
  # added: 2026-07-11; renewed 2026-10-14: re-probed from a residential IP, tiktok
  # and x 200 to lychee's user-agent; the block is on GitHub runner IPs, which a
  # local probe cannot reproduce. Renewed, not deleted. expires: 2027-01-12 (90 days)
  "^https?://(www\\.)?tiktok\\.com(/.*)?$",
  "^https?://(www\\.)?x\\.com(/.*)?$",
  "^https?://(www\\.)?twitter\\.com(/.*)?$",
  # Substack publication pages (asiansgingersintech.substack.com) return 403
  # Forbidden to lychee's user-agent (anti-bot), same class as the community
  # links above. /community/asians-gingers-in-tech/. Verified reachable
  # in-browser (200) 2026-07-18. added: 2026-07-18; expires: 2027-01-12 (90 days)
  # 2026-10-14: 200 from a local IP, but 403 to lychee from a GitHub runner, re-tested from a GitHub runner 2026-10-14 (draft PR #64, closed unmerged). Renewed.
  "^https?://([a-z0-9-]+\\.)?substack\\.com(/.*)?$",
  # Academic publishers and Medium return 403 Forbidden to lychee's user-agent
  # (anti-bot), same class as linkedin/substack above. These are the three
  # citations surfaced when docs/research stopped being excluded from the link
  # check; each was verified reachable in-browser 2026-07-21, so they are
  # anti-bot false positives, NOT broken links. Cited in 14_BLOG_CRAFT.md.
  # added: 2026-07-21; expires: 2027-01-12 (90 days)
  # 2026-10-14: dl.acm.org and tandfonline still 403 to lychee locally; medium 200 locally but 403 from a GitHub runner, re-tested from a GitHub runner 2026-10-14 (draft PR #64, closed unmerged). Renewed.
  "^https?://dl\\.acm\\.org(/.*)?$",
  "^https?://(www\\.)?tandfonline\\.com(/.*)?$",
  "^https?://(www\\.)?medium\\.com(/.*)?$",
  # Root-relative paths (href="/js/...", href="/legal/...", href="/private/...")
  # are Hugo internal paths that get rewritten at render time. Lychee scans
  # raw markdown and has no Hugo context, so it cannot resolve them without
  # a --base config that would only be correct for one class (static-file
  # paths OR content paths, never both). The earlier 'hugo --gc' build step
  # in the same CI job already fails on broken layouts / missing shortcodes /
  # undefined refs, so internal-link coverage is preserved.
  # STRUCTURAL: this is a config decision about what lychee can resolve, not a
  # site that might come back. Reviewed 2026-08-02 and the reasoning above still
  # holds. Expected to be renewed, not deleted.
  # added: 2026-08-02; expires: 2027-01-12 (90 days)
  # Reviewed 2026-10-14: the reasoning above still holds (config decision). Renewed.
  "^/[^/]",
]
