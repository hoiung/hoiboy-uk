  # uses lychee or this allowlist, so the primary defence is unaffected.
  # added: 2026-05-18; expires: 2026-08-16 (90 days)
  "^https?://(www\\.)?cal\\.(eu|com)(/.*)?$",
  # Academic publishers and Medium return 403 Forbidden to lychee's user-agent
  # (anti-bot), same class as linkedin/substack above. These are the three
  # citations surfaced when docs/research stopped being excluded from the link
  # check; each was verified reachable in-browser 2026-07-21, so they are
  # anti-bot false positives, NOT broken links. Cited in 14_BLOG_CRAFT.md.
  # added: 2026-07-21; expires: 2026-10-19 (90 days)
  "^https?://dl\\.acm\\.org(/.*)?$",
  "^https?://(www\\.)?tandfonline\\.com(/.*)?$",
  "^https?://(www\\.)?medium\\.com(/.*)?$",
  # noahkagan.com (a cited source in 14_BLOG_CRAFT.md) consistently times out
  # from GitHub runners (rate-limited/throttled anti-bot), yet returns HTTP 200
  # in <1s from a browser -- verified 2026-07-22. Same from-CI false-positive
  # class as the medium/acm/tandfonline entries above; it flaked CI 3x in one
  # session and cascade-skips Deploy. NOT a broken link.
  # added: 2026-07-22; expires: 2026-10-20 (90 days)
  "^https?://(www\\.)?noahkagan\\.com(/.*)?$",
