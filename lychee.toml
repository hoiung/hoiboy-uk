  # every-sme-needs-their-own-harness, prompts-agents-harnesses-whats-next and
  # for-the-love-of-wine. added: 2026-08-02; expires: 2026-10-31 (90 days)
  "^https?://(www\\.)?axios\\.com(/.*)?$",
