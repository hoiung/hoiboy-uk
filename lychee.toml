  # added: 2026-07-25; expires: 2026-10-23 (90 days)
  "^https?://(www\\.)?css-tricks\\.com(/.*)?$",
  "^https?://(www\\.)?ryanholiday\\.net(/.*)?$",
  # nngroup.com (Nielsen Norman Group) returns 403 Forbidden to GitHub Actions
