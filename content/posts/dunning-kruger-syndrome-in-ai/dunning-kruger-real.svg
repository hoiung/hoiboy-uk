<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     role="img"
     aria-label="Left: the real Kruger and Dunning 1999 Figure 1. Perceived ability stays nearly flat from the 58th to the 76th percentile while actual test score climbs steeply from the 12th to the 89th, so the two lines cross near the top. The bottom quartile overestimates itself by 46 percentile points and the top quartile underestimates itself. Right: the internet Mount Stupid curve, labelled Mount Stupid, Valley of Despair and Heroes Journey, which never appeared in the paper.">
  <title>What the 1999 Dunning-Kruger paper actually plots, next to the internet curve</title>
  <desc>A comparison of the real Figure 1 from Kruger and Dunning 1999 against the popular Mount Stupid graphic that was drawn later by other people.</desc>
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .card { fill: #ffffff; }
      .label { fill: #1a1a1a; font-weight: 600; }
      .muted { fill: #6a6a6a; }
      .boxstroke { stroke: #9aa0a6; }
      .trailstroke { stroke: #9aa0a6; }
      .accent { fill: #c0533a; }
      .accentstroke { stroke: #c0533a; }
      .ok { fill: #7aa869; }
      .watermark { fill: #87ceeb; }
      .labelstroke { stroke: #1a1a1a; }
      .mutedstroke { stroke: #6a6a6a; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #141414; }
        .card { fill: #1f1f1f; }
        .label { fill: #f0f0f0; }
        .muted { fill: #a6a6a6; }
        .boxstroke { stroke: #6a6a6a; }
        .trailstroke { stroke: #6a6a6a; }
        .labelstroke { stroke: #f0f0f0; }
        .mutedstroke { stroke: #a6a6a6; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="400"/>
  <text x="885" y="24" text-anchor="end" class="watermark" font-size="11" font-weight="400" letter-spacing="0.5">hoiboy.uk</text>

  <text x="60" y="34" class="label" font-size="13">What Kruger and Dunning actually measured (Study 1, humour)</text>

  <!-- ============ LEFT: the real chart ============ -->
  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="340" class="boxstroke" stroke-width="1.5"/>
  <line x1="90" y1="340" x2="545" y2="340" class="boxstroke" stroke-width="1.5"/>

  <!-- y gridlines + ticks: 0,25,50,75,100 -->
  <g class="muted" font-size="10">
    <line x1="90" y1="340" x2="545" y2="340" class="trailstroke" stroke-width="0.5" opacity="0.35"/>
    <line x1="90" y1="270" x2="545" y2="270" class="trailstroke" stroke-width="0.5" opacity="0.35"/>
    <line x1="90" y1="200" x2="545" y2="200" class="trailstroke" stroke-width="0.5" opacity="0.35"/>
    <line x1="90" y1="130" x2="545" y2="130" class="trailstroke" stroke-width="0.5" opacity="0.35"/>
    <line x1="90" y1="60"  x2="545" y2="60"  class="trailstroke" stroke-width="0.5" opacity="0.35"/>
    <text x="82" y="344" text-anchor="end">0</text>
    <text x="82" y="274" text-anchor="end">25</text>
    <text x="82" y="204" text-anchor="end">50</text>
    <text x="82" y="134" text-anchor="end">75</text>
    <text x="82" y="64"  text-anchor="end">100</text>
  </g>
  <text x="30" y="200" class="muted" font-size="11" text-anchor="middle" transform="rotate(-90 30 200)">Percentile</text>

  <!-- ACTUAL test score: 12, 37, 63, 89 -->
  <polyline points="150,306.4 260,236.4 370,163.6 480,90.8"
            fill="none" class="accentstroke" stroke-width="2.5" stroke-dasharray="6 4"/>
  <g class="accent">
    <circle cx="150" cy="306.4" r="5"/>
    <circle cx="260" cy="236.4" r="5"/>
    <circle cx="370" cy="163.6" r="5"/>
    <circle cx="480" cy="90.8"  r="5"/>
  </g>

  <!-- PERCEIVED ability: 58, 61, 71, 76 -->
  <polyline points="150,177.6 260,169.2 370,141.2 480,127.2"
            fill="none" class="labelstroke" stroke-width="2.5"/>
  <g class="label">
    <rect x="145.5" y="173.1" width="9" height="9"/>
    <rect x="255.5" y="164.7" width="9" height="9"/>
    <rect x="365.5" y="136.7" width="9" height="9"/>
    <rect x="475.5" y="122.7" width="9" height="9"/>
  </g>

  <!-- the 46-point gap at the bottom quartile -->
  <line x1="150" y1="177.6" x2="150" y2="306.4" class="accentstroke" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="162" y="238" class="accent" font-size="11" font-weight="600">46 points</text>
  <text x="162" y="252" class="muted" font-size="10">over-estimated</text>

  <!-- top-quartile underestimate: the gap reverses -->
  <line x1="480" y1="90.8" x2="480" y2="127.2" class="accentstroke" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="545" y="70" class="muted" font-size="10" text-anchor="end">at the top, the gap reverses:</text>
  <text x="545" y="84" class="muted" font-size="10" text-anchor="end">they under-rate themselves</text>

  <!-- x labels -->
  <g class="muted" font-size="10" text-anchor="middle">
    <text x="150" y="358">Bottom</text>
    <text x="260" y="358">2nd</text>
    <text x="370" y="358">3rd</text>
    <text x="480" y="358">Top</text>
    <text x="315" y="378" font-size="10">Quartile of actual test score</text>
  </g>

  <!-- legend -->
  <g font-size="10.5">
    <rect x="103" y="68" width="9" height="9" class="label"/>
    <line x1="98" y1="72.5" x2="117" y2="72.5" class="labelstroke" stroke-width="2.5"/>
    <text x="124" y="76" class="muted">Perceived ability (what they thought)</text>
    <line x1="98" y1="92" x2="117" y2="92" class="accentstroke" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="107.5" cy="92" r="5" class="accent"/>
    <text x="124" y="95.5" class="muted">Actual test score (what they got)</text>
  </g>

  <!-- ============ RIGHT: the meme ============ -->
  <rect x="600" y="60" width="285" height="322" rx="10" class="card"/>
  <rect x="600" y="60" width="285" height="322" rx="10" fill="none" class="boxstroke" stroke-width="1.2"/>

  <text x="615" y="84" class="label" font-size="12">The version everyone shares</text>

  <text x="668" y="126" class="muted" font-size="9" text-anchor="middle">Mount Stupid</text>
  <path d="M 620 250 C 636 250, 648 142, 668 140 C 688 138, 702 243, 726 250 C 760 257, 820 205, 868 176"
        fill="none" class="mutedstroke" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="729" y="272" class="muted" font-size="9" text-anchor="middle">Valley of Despair</text>

  <!-- the whole arc, as the meme frames it -->
  <text x="744" y="292" class="muted" font-size="9" text-anchor="middle">Heroes Journey</text>
  <line x1="620" y1="304" x2="861" y2="304" class="mutedstroke" stroke-width="1" opacity="0.7"/>
  <polygon points="868,304 859,300.5 859,307.5" class="muted" opacity="0.7"/>

  <line x1="620" y1="320" x2="868" y2="320" class="trailstroke" stroke-width="0.8" opacity="0.5"/>

  <text x="615" y="342" class="accent" font-size="11" font-weight="600">Not in the 1999 paper.</text>
  <text x="615" y="360" class="muted" font-size="10.5">Someone drew it later, and the</text>
  <text x="615" y="376" class="muted" font-size="10.5">internet has been sharing it since.</text>
</svg>
