  "^https?://(www\\.)?lokiwine\\.co\\.uk(/.*)?$",
  # Root-relative paths (href="/js/...", href="/legal/...", href="/private/...")
  # are Hugo internal paths that get rewritten at render time. Lychee scans
  # raw markdown and has no Hugo context, so it cannot resolve them without
  # a --base config that would only be correct for one class (static-file
  # paths OR content paths, never both). The earlier 'hugo --gc' build step
  # in the same CI job already fails on broken layouts / missing shortcodes /
  # undefined refs, so internal-link coverage is preserved.
  # STRUCTURAL: this is a config decision about what lychee can resolve, not a
  # site that might come back. Reviewed 2026-08-02 and the reasoning above still
  # holds. Expected to be renewed, not deleted.
  # added: 2026-08-02; expires: 2026-10-31 (90 days)
  "^/[^/]",
  # freecodecamp.org (a cited source in 14_BLOG_CRAFT.md since 2026-04-10,
  # commit 0f1e518) started returning HTTP 525 on 2026-08-08, breaking CI on
  # main and cascade-skipping Deploy with no repo change to that file.
  # NOT the same class as the anti-bot (403) or origin-IP (415) entries above:
  # 525 is Cloudflare-to-origin SSL handshake failure, i.e. THEIR site is down,
  # and it reproduces from a local machine under a browser UA as well as from
  # the CI runner. Verified 2026-08-08: the domain ROOT and /news/ both 525 too,
  # so this is a site-wide outage, not a broken or moved article.
  # DELIBERATELY SHORT WINDOW (14 days, not the usual 90): a TLS outage should
