  # main and cascade-skipped Deploy. NOT broken links. Re-test from CI before renewing.
  # added: 2026-07-26; expires: 2026-10-24 (90 days)
  "^https?://(www\\.)?nngroup\\.com(/.*)?$",
  # backlinko.com, seangoedecke.com and gohugo.io all fail from GitHub Actions
  # runner IPs: backlinko with "Connection failed", the other two with timeouts.
  # Same ORIGIN-IP blocking class as css-tricks/ryanholiday/nngroup directly
  # above, and the same untouched-since-April citations: backlinko at
  # docs/research/14_BLOG_CRAFT.md:206-207, seangoedecke at :395, gohugo at
  # docs/research/16_AI_BOT_AND_SEO_POLICY.md:209. Nothing in the repo changed.
  # Not transients: lychee retries timeouts (max_retries defaults to 3, measured
  # 2026-08-01), so each timing-out URL had four attempts at the configured 20s
  # and failed all four. All three return 200 in under a second from a local IP,
  # verified 2026-08-01. They failed CI on main and cascade-skipped Deploy.
  # NOT broken links. Re-test from CI before renewing.
  # added: 2026-08-01; expires: 2026-10-30 (90 days)
  "^https?://(www\\.)?backlinko\\.com(/.*)?$",
  "^https?://(www\\.)?seangoedecke\\.com(/.*)?$",
  "^https?://(www\\.)?gohugo\\.io(/.*)?$",
  # axios.com, openai.com and lokiwine.co.uk return 403 Forbidden to lychee's
  # user-agent, same anti-bot class as medium/dl.acm.org above. Surfaced by #55
  # AC 0.1, the FIRST run of the rendered-link gate over the post corpus, which
  # had been voided by the `public/blogs` exclude_path entry since blog-priv#62,
