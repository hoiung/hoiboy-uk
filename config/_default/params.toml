# Site params. Read by layouts/. Every key here MUST be referenced
# in at least one layout file. Dead keys fail config-traceability check.

# Dark mode: auto via prefers-color-scheme. No JS toggle. Both modes audited
# WCAG AA. See docs/research/07_DESIGN_TOKENS.md for the full design token table.

description = "Personal blog of Hoi. Food, booze, adventure, dance, tech and AI."
author = "Hoi"
brandName = "Life of O'Hoi"

# Authoritative external profiles for Schema.org Person.sameAs. These
# let LinkedIn, Google, and Bing wire the author entity on posts to a
# canonical profile ID across the web, which is the E-E-A-T signal
# required for proper author attribution in rich results and link
# preview cards. Referenced in layouts/_partials/head.html JSON-LD.
authorSameAs = [
  "https://www.linkedin.com/in/hoiung/",
  "https://github.com/hoiung",
]

# Design tokens: see docs/research/07_DESIGN_TOKENS.md
# (created during Phase 0.9 with hex value, contrast ratios, rationale).
# Accent: warm terracotta. Single colour applied to links + active nav.
accentColor = "#c0533a"

# CTA button fill. The LOGO GREEN DARKENED FOR LEGIBILITY, and that description
# is exact rather than approximate, because getting it wrong once already cost a
# round trip.
#
# The logo's own green is #228b22, which is exactly the CSS named colour
# `forestgreen`. This value is that green darkened by rgb(10, 7, 10).
#
# Precisely: #228b22 is the dominant GREEN in assets/images/logo.png at 52,819
# opaque pixels, but only 4th by overall pixel count, behind the #87ceeb field at
# 58.57%. It holds that same rank in the three favicon derivatives head.html
# resizes from logo.png (32/192/180); the wide sidebar logo is a different source
# file, logo_wide.png, and carries none of it. The earlier wording here said
# "dominant across the source and all four served sizes", which overstated on
# both halves.
#
# It is NOT the logo colour and must not be labelled as such. It was chosen over
# the exact logo green on a readability comparison the operator made on the live
# site, having seen both deployed:
#
#   fill      white label   --fg #1a1a1a label   note
#   #228b22   4.39:1 FAIL   3.97:1 FAIL          exact logo green, a mid-tone
#   #188418   4.82:1 pass   -                    shipped, clears AA at body size
#
# One caveat, because the earlier wording overreached into "NO label colour
# clears AA 4.5:1" and that is false: #228b22 DOES clear 4.5:1 against pure black
# (4.78:1), and against every grey up to #0a0a0a. What makes it unusable is this
# theme's own palette, whose text colour is --fg #1a1a1a in light mode and
# #e8e8e8 in dark. Against those two there is no passing label, so the brand
# green is unreachable at AA here even though it is not unreachable in the
# abstract.
#
# Hence the deliberate trade: a shade off the logo, in exchange for a label that
# is comfortably legible. Operator decision, made with both rendered live.
#
# Deliberately NOT accentColor either: that is already the colour of every link
# on the site, so a terracotta button reads as page furniture rather than a call
# to action.
ctaColor = "#188418"

# Per-section layout switch. Sections in textFirstSections render
# as plain title+date list (Tech & AI). All others get image-card layout.
textFirstSections = ["tech-ai", "entrepreneurship", "trading"]

# Footer
footerText = "Senh Hoi Ung. CC BY-SA."

# Newsletter subscribe form (#56). Read by layouts/_partials/subscribe-form.html.
#
# Only genuinely configurable values live here. The consent label, its "No spam"
# note and the consent_version string are NOT params: AC 1.1 pins that wording
# across four surfaces (the form markup, KNOWN_CONSENT_VERSIONS in
# functions/api/subscribe.js, the mirror in tests/subscribe.test.js, and the
# version quoted in prose in content/legal/privacy/index.md), and a
# versioned legal string is not a parameter. No-Hardcoded-Settings governs
# parameters, not legally versioned copy.
#
# The Brevo list id is deliberately absent. Every key declared here must be read
# by a layout (see the header above), so declaring it would force the id into the
# rendered HTML of every page for no consumer: a Pages Function cannot read
# params.toml. It reaches functions/api/subscribe.js as the BREVO_LIST_ID
# environment variable and nowhere else.
subscribeAction = "/api/subscribe"

# Public by design. A Turnstile SITE key is rendered into the page and is not a
# secret (the paired secret key is the TURNSTILE_SECRET_KEY Pages binding). This
# is the same widget the AGIT form uses, so the newsletter adds no new Turnstile
# provisioning. See docs/research/09_DEPLOYMENT.md.
turnstileSiteKey = "0x4AAAAAADz-CB1k9o8zx3S8"
