# Sidebar nav. Flat, constant size. Only the category nav is specified in
# docs/research/06_TAXONOMY.md; the Hire Hoi, community, and social sections are not.
# Order matters: top (Home), Hire Hoi, categories, community, social.
#
# The `categories` menu renders under the sidebar heading "Blogs" (not
# "Categories" - layouts/_partials/sidebar.html) and its 7 entries are the
# authoritative category set: layouts and tests read it rather than hardcoding
# the slugs. Their URLs carry the /blogs/ prefix set in hugo.toml
# [permalinks.section] (blog-priv#62); the old root-level URLs are 301'd in
# static/_redirects.

